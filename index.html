        <!-- Botão e painel lateral para consulta de processo -->
<button id="open-panel-btn" onclick="toggleSidePanel()" style="display:none;">
    <img id="btn-icon" src="images/consultar.png" alt="" style="height:30px; width:auto;">
</button>
<div id="side-panel">
    <iframe src="https://sistemas.anm.gov.br/SCM/Extra/site/admin/dadosProcesso.aspx"></iframe>
</div>

<style>
#side-panel {
    position: fixed;
    right: -25vw;
    top: 20px;
    width: 25vw;
    height: calc(100vh - 20px);
    background-color: #f1f1f1;
    box-shadow: -2px 0 5px rgba(0,0,0,0.5);
    transition: right 0.3s ease;
    z-index: 3000;
}
#side-panel.panel-open {
    right: 0;
}
#side-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
}
#open-panel-btn {
    position: absolute;
    right: 12px;
    top: 90px;
    padding: 4px 6px;
    background: #f4f4f4;
    border: none;
    cursor: pointer;
    z-index: 999;
    border-radius: 4px;
    transition: right 0.3s;
}
#open-panel-btn.panel-open {
    right: 26vw; /* Um pouco à esquerda do painel lateral */
}
@media (max-width: 600px) {
    #side-panel {
        width: 75vw;
        right: -90vw; /* Fechado */
        transition: right 0.3s;
    }
    #side-panel.panel-open {
        right: 0; /* Aberto */
    }
    #open-panel-btn.panel-open {
        right: 75vw;
    }
}
</style>

<script>
function toggleSidePanel() {
    var sidePanel = document.getElementById("side-panel");
    var btn = document.getElementById("open-panel-btn");
    var icon = document.getElementById("btn-icon");
    sidePanel.classList.toggle("panel-open");
    btn.classList.toggle("panel-open");
    if (sidePanel.classList.contains("panel-open")) {
        icon.src = "images/x.png";
    } else {
        icon.src = "images/consultar.png";
    }
}
</script>

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<script>
var modalImg = document.getElementById('modal-img-mapa');
var modalDiv = document.getElementById('modal-imagem-mapa');
var escalaAtual = 1;
var isDragging = false;
var lastX = 0, lastY = 0;
var posX = 0, posY = 0;

// Função para abrir o modal e resetar tudo
function abrirImagemNoMapa(src) {
    modalDiv.style.display = 'flex';
    modalImg.src = src;
    escalaAtual = 1;
    posX = 0;
    posY = 0;
    modalImg.style.transform = 'scale(1) translate(0px,0px)';
    modalImg.style.transformOrigin = '50% 50%';
    modalImg.style.cursor = 'pointer';
}

// Zoom com scroll do mouse
modalImg.addEventListener('wheel', function(e) {
    e.preventDefault();
    modalImg.style.transformOrigin = '50% 50%';
    var zoomFactor = 1.1;
    if (e.deltaY < 0) {
        escalaAtual *= zoomFactor;
    } else {
        escalaAtual /= zoomFactor;
        if (escalaAtual < 1) escalaAtual = 1;
    }
    // Se o zoom voltou para 1, centraliza
    if (escalaAtual === 1) {
        posX = 0;
        posY = 0;
    }
    modalImg.style.transform = 'scale(' + escalaAtual + ') translate(' + posX + 'px,' + posY + 'px)';
});

// Arrasto da imagem
modalImg.addEventListener('mousedown', function(e) {
    if (escalaAtual > 1) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        modalImg.style.cursor = 'grab';
        e.preventDefault();
    }
});
document.addEventListener('mousemove', function(e) {
    if (isDragging) {
        var dx = e.clientX - lastX;
        var dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        posX += dx;
        posY += dy;
        modalImg.style.transform = 'scale(' + escalaAtual + ') translate(' + posX + 'px,' + posY + 'px)';
    }
});
document.addEventListener('mouseup', function() {
    if (isDragging) {
        isDragging = false;
        modalImg.style.cursor = 'pointer';
    }
});

// Evita fechar o modal ao clicar na imagem
modalImg.addEventListener('click', function(e) {
    e.stopPropagation();
});

// Fecha o modal ao clicar fora da imagem
modalDiv.onclick = function(e) {
    if (e.target === this) modalDiv.style.display = 'none';
};
</script>
<script>
let touchStartDist = 0;
let initialScale = 1;

modalImg.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
        e.preventDefault();
        touchStartDist = getTouchDistance(e.touches[0], e.touches[1]);
        initialScale = escalaAtual;
    }
}, { passive: false });

modalImg.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2) {
        e.preventDefault();
        const currentDist = getTouchDistance(e.touches[0], e.touches[1]);
        const scaleChange = currentDist / touchStartDist;
        escalaAtual = Math.max(1, initialScale * scaleChange);
        // Se o zoom voltou para 1, centraliza
        if (escalaAtual === 1) {
            posX = 0;
            posY = 0;
        }
        modalImg.style.transform = `scale(${escalaAtual}) translate(${posX}px, ${posY}px)`;
    }
}, { passive: false });

function getTouchDistance(touch1, touch2) {
    const dx = touch2.clientX - touch1.clientX;
    const dy = touch2.clientY - touch1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
}
</script>

<script>
    (function() {
        // --- Variáveis Globais do Script ---
        var searchMarker = null;
        var municipioSearchIndex = []; // Nosso índice de busca
        var searchInput = null; // Referência ao input
        var suggestionsContainer = null; // Referência à lista de sugestões

        // =============================================================
        // FUNÇÕES AUXILIARES
        // =============================================================
        
        /**
         * Normaliza uma string (minúsculas, sem acentos)
         */
        function normalizeString(str) {
            if (typeof str !== 'string') return '';
            return str.toLowerCase()
                      .normalize("NFD")
                      .replace(/[\u0300-\u036f]/g, "");
        }

        /**
         * Converte Graus, Minutos, Segundos (DMS) para Graus Decimais (DD)
         */
        function parseDMSToDD(degrees, minutes, seconds, direction) {
            var dd = parseFloat(degrees) + (parseFloat(minutes) / 60) + (parseFloat(seconds) / 3600);
            if (direction === 'S' || direction === 'O' || direction === 'W') {
                dd = dd * -1;
            }
            return dd;
        }

        /**
         * Converte Graus, Minutos Decimais (DMM) para Graus Decimais (DD)
         */
        function parseDMMToDD(degrees, minutes, direction) {
            var dd = parseFloat(degrees) + (parseFloat(minutes) / 60);
            if (direction === 'S' || direction === 'O' || direction === 'W') {
                dd = dd * -1;
            }
            return dd;
        }

        /**
         * Constrói o índice de busca de municípios para autocomplete
         */
        function buildSearchIndex() {
            var propertyName = 'Município';
            if (typeof layer_Municpios_2 === 'undefined') {
                console.error("Erro: layer_Municpios_2 não está definida. A busca por município não funcionará.");
                return;
            }
            
            layer_Municpios_2.eachLayer(function (layer) {
                if (layer.feature.properties && typeof layer.feature.properties[propertyName] === 'string') {
                    var nome = layer.feature.properties[propertyName];
                    municipioSearchIndex.push({
                        nome: nome,
                        nomeNormalizado: normalizeString(nome),
                        bounds: layer.getBounds()
                    });
                }
            });
            // console.log("Índice de busca de municípios construído:", municipioSearchIndex.length, "itens");
        }

        /**
         * Mostra as sugestões de autocomplete
         */
        function showSuggestions(query) {
            suggestionsContainer.innerHTML = ''; // Limpa antigas
            var normalizedQuery = normalizeString(query);

            if (normalizedQuery.length < 3) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            var results = municipioSearchIndex.filter(function(item) {
                return item.nomeNormalizado.includes(normalizedQuery);
            });

            if (results.length === 0) {
                suggestionsContainer.style.display = 'none';
                return;
            }

            results.slice(0, 10).forEach(function(result) { // Limita a 10 resultados
                var item = L.DomUtil.create('div', 'leaflet-control-search-suggestion-item', suggestionsContainer);
                item.textContent = result.nome;
                
                // 'mousedown' é usado em vez de 'click' para disparar ANTES do 'focusout' do input
                L.DomEvent.on(item, 'mousedown', function(e) {
                    L.DomEvent.stop(e);
                    map.fitBounds(result.bounds);
                    clearSearch();
                });
            });

            suggestionsContainer.style.display = 'block';
        }

        /**
         * Limpa o campo de busca e esconde sugestões
         */
        function clearSearch() {
            if (searchInput) {
                searchInput.value = '';
                searchInput.classList.remove('active');
            }
            if (suggestionsContainer) {
                suggestionsContainer.innerHTML = '';
                suggestionsContainer.style.display = 'none';
            }
            if (searchMarker) {
                map.removeLayer(searchMarker);
                searchMarker = null;
            }
        }
        

        // =============================================================
        // LÓGICA DO CONTROLE DE BUSCA
        // =============================================================

        // 1. Criar um novo Controle Leaflet
        var SearchControl = L.Control.extend({
            options: {
                position: 'topleft' 
            },
            onAdd: function (map) {
                var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-search');
                
                var button = L.DomUtil.create('a', 'leaflet-control-search-button', container);
                button.innerHTML = '&#x1F50D;';
                button.href = '#';
                button.role = 'button';
                button.title = 'Pesquisar';
                
                searchInput = L.DomUtil.create('input', 'leaflet-control-search-input', container);
                searchInput.type = 'text';
                searchInput.placeholder = 'município, coord...'; 
                
                // --- NOVO CONTAINER DE SUGESTÕES ---
                suggestionsContainer = L.DomUtil.create('div', 'leaflet-control-search-suggestions', container);

                L.DomEvent.disableClickPropagation(container);
                L.DomEvent.on(container, 'mousewheel', L.DomEvent.stopPropagation);
                
                L.DomEvent.on(button, 'click', function (e) {
                    L.DomEvent.stop(e);
                    searchInput.classList.toggle('active');
                    if (searchInput.classList.contains('active')) {
                        searchInput.focus();
                    } else {
                        clearSearch();
                    }
                });
                
                // --- NOVO EVENTO: 'input' (a cada letra digitada) ---
                L.DomEvent.on(searchInput, 'input', function (e) {
                    showSuggestions(searchInput.value);
                });

                // --- EVENTO 'keydown' (para 'Enter') ---
                L.DomEvent.on(searchInput, 'keydown', function (e) {
                    if (e.keyCode == 13) { // Enter
                        L.DomEvent.stop(e);
                        handleSearch(searchInput.value); // Função principal de busca
                        clearSearch(); // Limpa tudo após o Enter
                    }
                });

                // --- NOVO EVENTO: 'focusout' (para esconder a lista) ---
                L.DomEvent.on(searchInput, 'focusout', function(e) {
                    // Dá um pequeno atraso para permitir que o clique no item da sugestão funcione
                    setTimeout(function() {
                        if (suggestionsContainer) {
                            suggestionsContainer.style.display = 'none';
                        }
                    }, 200); 
                });

                return container;
            }
        });

        // 2. Adicionar o controle ao mapa
        map.addControl(new SearchControl());

        // 3. Construir o índice de busca DEPOIS que o controle foi adicionado
        buildSearchIndex();


        // 4. Função principal que processa a busca (ao pressionar Enter)
        function handleSearch(query) {
            
            var rawQuery = (typeof query === 'string' ? query.trim() : '');

            if (searchMarker) {
                map.removeLayer(searchMarker);
                searchMarker = null;
            }

            var dmsRegex = /^\s*(\d+)[° ]\s*(\d+)[ ']\s*(\d*\.?\d*)[" ]\s*([NS])\s*[, ]\s*(\d+)[° ]\s*(\d+)[ ']\s*(\d*\.?\d*)[" ]\s*([LEOW])\s*$/i;
            var dmmRegex = /^\s*(\d+)[° ]\s*(\d+\.?\d*)[ ']\s*([NS])\s*[, ]\s*(\d+)[° ]\s*(\d+\.?\d*)[ ']\s*([LEOW])\s*$/i;
            var ddRegex = /^\(?\s*(-?\d+\.?\d*)\s*[, ]\s*(-?\d+\.?\d*)\s*\)?$/;

            var dmsMatch = rawQuery.match(dmsRegex);
            var dmmMatch = rawQuery.match(dmmRegex);
            var ddMatch = rawQuery.match(ddRegex);

            var lat = NaN;
            var lon = NaN;

            try {
                if (dmsMatch) {
                    // --- LÓGICA 1: DMS ---
                    var latD = dmsMatch[1], latM = dmsMatch[2], latS = dmsMatch[3], latDir = dmsMatch[4].toUpperCase();
                    var lonD = dmsMatch[5], lonM = dmsMatch[6], lonS = dmsMatch[7], lonDir = dmsMatch[8].toUpperCase();
                    lat = parseDMSToDD(latD, latM, latS, latDir);
                    lon = parseDMSToDD(lonD, lonM, lonS, lonDir);

                } else if (dmmMatch) {
                    // --- LÓGICA 2: DMM ---
                    var latD = dmmMatch[1], latM = dmmMatch[2], latDir = dmmMatch[3].toUpperCase();
                    var lonD = dmmMatch[4], lonM = dmmMatch[5], lonDir = dmmMatch[6].toUpperCase();
                    lat = parseDMMToDD(latD, latM, latDir);
                    lon = parseDMMToDD(lonD, lonM, lonDir);
                    
                } else if (ddMatch) {
                    // --- LÓGICA 3: DD ---
                    lat = parseFloat(ddMatch[1]);
                    lon = parseFloat(ddMatch[2]);
                }

                if (!isNaN(lat) && !isNaN(lon)) {
                    // --- SUCESSO NA BUSCA POR COORDENADA ---
                    var latlng = L.latLng(lat, lon);
                    searchMarker = L.marker(latlng).addTo(map);
                    map.setView(latlng, 15); // Zoom 15
                    return; // Para a execução aqui
                
                } 
                // --- LÓGICA 4: Busca por Município (ao pressionar Enter) ---
                else if (rawQuery.length > 0) {
                    var normalizedQuery = normalizeString(rawQuery);
                    
                    // Procura no índice a primeira correspondência
                    var found = municipioSearchIndex.find(function(item) {
                        return item.nomeNormalizado.includes(normalizedQuery);
                    });

                    if (found) {
                        map.fitBounds(found.bounds);
                    } else {
                        alert('Município ou coordenada "' + rawQuery + '" não encontrado(a) ou em formato inválido.');
                    }
                } else {
                    alert('Por favor, insira um termo de pesquisa.');
                }
            } catch (e) {
                console.error("Erro ao processar busca:", e);
                alert('Erro ao processar sua busca. Verifique o formato.');
            }
        }

    })(); // Fim da função auto-executável
</script>
